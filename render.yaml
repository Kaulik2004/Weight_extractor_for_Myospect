# Render Blueprint for the backend API (the frontend is deployed on Vercel).
# Render asks for every "sync: false" value when you create the Blueprint.
services:
  - type: web
    runtime: docker
    name: weight-extractor-api
    rootDir: backend
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: APP_PASSWORD
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      # Every Vercel URL of the frontend project (production and previews).
      - key: WX_CORS_ORIGIN_REGEX
        value: https://weight-extractor[a-z0-9-]*\.vercel\.app
